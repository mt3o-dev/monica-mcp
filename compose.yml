services:
  monica-mcp:
    build: .
    image: monica-mcp:latest
    container_name: monica-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_PORT: 8779
    networks: [shared]
    ports:
      # Loopback only. Still no public route in v1 — this binds to 127.0.0.1,
      # not 0.0.0.0, so nothing outside this host can reach it. It exists
      # because the Telegram bots run as host processes rather than containers
      # and would otherwise have no route at all. The bearer token remains the
      # trust boundary, exactly as before. See ADR 0002 and ADR 0003.
      - "127.0.0.1:8779:8779"

networks:
  shared:
    # Real network name comes from .env (gitignored), so this file stays
    # portable: DOCKER_NETWORK=<your shared network>
    name: ${DOCKER_NETWORK:-mcp-net}
    external: true
